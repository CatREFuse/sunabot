name: sunabot-mcp-image

services:
  mcp-image:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: ${SUNABOT_MCP_IMAGE:-sunabot-mcp:local}
    entrypoint: ["/usr/local/bin/node"]
    command: ["--version"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
