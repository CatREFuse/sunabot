name: sunabot-bash-image

services:
  bash-image:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile.bash
    image: ${SUNABOT_BASH_IMAGE:-sunabot-bash:local}
    command: ["/usr/bin/true"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
