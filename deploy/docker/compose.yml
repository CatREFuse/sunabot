name: sunabot

services:
  core:
    profiles: ["core-docker"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        SUNABOT_RELEASE_VERSION: ${SUNABOT_RELEASE_VERSION:-0.1.0}
    image: sunabot-core:${SUNABOT_IMAGE_TAG:-local}
    platform: linux/amd64
    user: "${SUNABOT_RUNTIME_UID:-1000}:${SUNABOT_RUNTIME_GID:-1000}"
    restart: unless-stopped
    env_file:
      - ${SUNABOT_RUNTIME_ENV:?Set SUNABOT_RUNTIME_ENV to workspace/secrets/runtime.env}
    environment:
      NODE_ENV: production
      SUNABOT_RUNTIME_MODE: docker
      SUNABOT_HOST: 0.0.0.0
      SUNABOT_PORT: 8787
      SUNABOT_ONEBOT_HOST: 0.0.0.0
      SUNABOT_ONEBOT_PORT: 8788
      SUNABOT_WORKSPACE: /srv/sunabot/workspace
      SUNABOT_CODEX_EXECUTABLE: /usr/local/bin/codex
      SUNABOT_CODEX_BIN: /usr/local/bin/codex
      HOME: /srv/sunabot/workspace/runtime/tmp/core-home
      XDG_CACHE_HOME: /srv/sunabot/workspace/cache/core
      SUNABOT_PROXY_MODE: ${SUNABOT_PROXY_MODE:-auto}
      SUNABOT_PROXY_DISCOVERED_URL: ${SUNABOT_PROXY_DISCOVERED_URL:-}
      SUNABOT_MOSS_TTS_NANO_URL: ${SUNABOT_MOSS_TTS_NANO_URL:-http://sunabot-moss-tts-nano:18083}
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1,[::1],core,host.docker.internal}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1,::1,[::1],core,host.docker.internal}"
    ports:
      - "127.0.0.1:8787:8787"
    expose:
      - "8788"
    volumes:
      - ${SUNABOT_WORKSPACE:?Set SUNABOT_WORKSPACE to an absolute path}:/srv/sunabot/workspace
    shm_size: 1gb
    stop_grace_period: 35s
    pids_limit: 512
    mem_limit: ${SUNABOT_MEMORY_LIMIT:-4g}
    cpus: ${SUNABOT_CPU_LIMIT:-4.0}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp=deploy/docker/seccomp-bwrap.json
    cap_drop:
      - ALL
    labels:
      io.sunabot.runtime-id: ${SUNABOT_RUNTIME_ID:-sunabot-qq-runtime}
      io.sunabot.workspace-id: ${SUNABOT_WORKSPACE_ID:?Set SUNABOT_WORKSPACE_ID through the launcher}
      io.sunabot.component: core
    logging:
      driver: local
      options:
        max-size: ${SUNABOT_LOG_MAX_SIZE:-20m}
        max-file: ${SUNABOT_LOG_MAX_FILES:-5}
    networks:
      - runtime

  napcat:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.napcat
    image: sunabot-napcat:${NAPCAT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      WEBUI_TOKEN: ${WEBUI_TOKEN:?Set WEBUI_TOKEN in workspace/secrets/runtime.env}
      WEBUI_PREFIX: ${WEBUI_PREFIX:-}
      NAPCAT_UID: ${SUNABOT_RUNTIME_UID:-1000}
      NAPCAT_GID: ${SUNABOT_RUNTIME_GID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SUNABOT_WORKSPACE:?Set SUNABOT_WORKSPACE to an absolute path}/runtime/napcat/accounts/${NAPCAT_ACCOUNT_ID:-primary}/config-full:/app/napcat/config
      - ${SUNABOT_WORKSPACE:?Set SUNABOT_WORKSPACE to an absolute path}/runtime/napcat/accounts/${NAPCAT_ACCOUNT_ID:-primary}/qq:/app/.config/QQ
      - ${SUNABOT_WORKSPACE:?Set SUNABOT_WORKSPACE to an absolute path}/runtime/napcat/accounts/${NAPCAT_ACCOUNT_ID:-primary}/plugins:/app/napcat/plugins
      - ${SUNABOT_WORKSPACE:?Set SUNABOT_WORKSPACE to an absolute path}/runtime/napcat/accounts/${NAPCAT_ACCOUNT_ID:-primary}:/app/napcat/cache
    shm_size: 1gb
    stop_grace_period: 35s
    pids_limit: 512
    mem_limit: ${NAPCAT_MEMORY_LIMIT:-2g}
    cpus: ${NAPCAT_CPU_LIMIT:-2.0}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /app/.cache:rw,nosuid,nodev,size=256m,mode=0700,uid=${SUNABOT_RUNTIME_UID:-1000},gid=${SUNABOT_RUNTIME_GID:-1000}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6099'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    labels:
      io.sunabot.runtime-id: ${SUNABOT_RUNTIME_ID:-sunabot-qq-runtime}
      io.sunabot.workspace-id: ${SUNABOT_WORKSPACE_ID:?Set SUNABOT_WORKSPACE_ID through the launcher}
      io.sunabot.component: napcat
      io.sunabot.account-id: ${NAPCAT_ACCOUNT_ID:-primary}
    logging:
      driver: local
      options:
        max-size: ${SUNABOT_LOG_MAX_SIZE:-20m}
        max-file: ${SUNABOT_LOG_MAX_FILES:-5}
    networks:
      runtime:
        aliases:
          - napcat-${NAPCAT_ACCOUNT_ID:-primary}

networks:
  runtime:
    name: ${SUNABOT_DOCKER_NETWORK:-sunabot-runtime}
    external: true
