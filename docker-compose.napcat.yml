services:
  napcat:
    image: mlikiowa/napcat-docker:v4.15.0
    container_name: sunabot-napcat
    restart: unless-stopped
    ports:
      - "6099:6099"
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - ACCOUNT=3971235731
    volumes:
      - ${SUNABOT_WORKSPACE:-./workspace}/napcat:/app/.config/QQ
      - ${SUNABOT_WORKSPACE:-./workspace}/napcat/config-full:/app/napcat/config
